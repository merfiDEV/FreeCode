name: "CI: Build"

# Build on every push to main, but do NOT bump the version or publish a
# release — releases are created from v* tags (see release.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install --no-fund --no-audit

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build (nsis + portable + zip)
        run: npm run build:win:local

      - uses: actions/upload-artifact@v4
        with:
          name: Windows-build
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.zip
            release/latest.yml
          retention-days: 7
